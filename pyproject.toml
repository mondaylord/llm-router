[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router"
version = "0.1.0"
description = "Production-oriented model routing layer (rule + classifier hybrid)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "structlog>=24.1",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  # sentence-transformers is heavy; keep it as optional via the ml extra below
  # so unit tests / rules can run on a slim image.
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=2.6",
  "torch>=2.1",
]
gateway = [
  "litellm>=1.40",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
llm-router = "llm_router.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
